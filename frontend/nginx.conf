server {
    listen 80;
    server_name localhost;

    # Файлы до 25 МБ (с запасом от лимита 20 МБ в бэкенде)
    client_max_body_size 25m;

    # Таймауты под LLM — генерация может занять несколько минут
    proxy_connect_timeout 60s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    # Gzip для JS/CSS/JSON (ответы API) — экономит трафик
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Не буферизировать ответы (важно для скачивания файлов и стриминга)
        proxy_buffering off;
        proxy_request_buffering off;
    }
}