server {
    listen 80;
    server_name localhost;

    # Корневая папка для статики
    root /usr/share/nginx/html;
    index index.html;

    # Для React SPA: все пути, которые не найдены как файлы, отдаем в index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Проксирование запросов к API на бэкенд
    location /api/ {
        # Убираем /api из пути перед отправкой на бэкенд
        # Например, /api/auth/login -> http://backend:8000/auth/login
        proxy_pass http://backend:8000/;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}