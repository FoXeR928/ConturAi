[project]
name = "Ragi_AI"
version = "0.3.4"
description = "AI integrator ollama and qdrant"
authors = [
    {name = "foxer928",email = "nik280302@yandex.ru"}
]
repository = "https://github.com/FoXeR928/Ragi_AI"
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "flask (==3.1.1)",
    "flask-login (==0.6.3)",
    "sqlalchemy (==2.0.41)",
    "flask_sqlalchemy (==3.1.1)",
    "pytesseract (==0.3.13)",
    "pdf2image (==1.17.0)",
    "python-docx (==1.2.0)",
    "openpyxl (==3.1.5)",
    "pymorphy3 (==2.0.4)",
    "langchain-text-splitters (==0.3.8)",
    "Flask-WTF (==1.2.2)",
    "ollama (==0.5.1)",
    "qdrant-client (==1.14.3)",
    "sentence-transformers (==5.0.0)",
]


[build-system]
requires = [
    "poetry-core>=2.0.0,<3.0.0",
]
build-backend = "poetry.core.masonry.api"
