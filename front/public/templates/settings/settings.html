{% extends "sample_back.html" %}

{% block title %}Настройки{% endblock %}

{% block styles %}
<link rel="stylesheet" href="/static/style/style_settings.css">
{% endblock %}

{% block content %}
<form class="form_with_back" method="post">
    <label for="app_port">Порт приложения</label>
    <input id="app_port" type="number" value="7000">
    <select id="sql_driver">
        <option value="" selected disabled hidden>Выберите драйвер SQL</option>
        <option value="sqlite">SQLite</option>
        <option value="mysql">MySQL</option>
        <option value="postgresql">PostgreSQL</option>
    </select>
    <label for="sql_host">Хост SQL</label>
    <input id="sql_host" type="text">
    <label for="sql_port">Порт SQL</label>
    <input id="sql_port" type="number">
    <label for="sql_db">Имя базы данных SQL</label>
    <input id="sql_db" type="text" value="ragi_db">
    <label for="sql_user">Пользователь SQL</label>
    <input id="sql_user" type="text">
    <label for="sql_password">Пароль SQL</label>
    <input id="sql_password" type="password">
    <label for="db_path">Путь базы данных</label>
    <input id="db_path" type="text" value="./instance">
</form>
{% endblock %}
{% block scripts %}
<script src="/static/js/setting_db.js"></script>
{% endblock %}
