{% extends "sample_user.html" %}

{% block title %}Чаты{% endblock %}

{% block styles %}
<link rel="stylesheet" href="/static/style/style_chats.css">
<link rel="stylesheet" href="/static/style/style_form.css">
{% endblock %}

{% block content %}
<dialog class="form_background" id="hide_form">
    <div class="form_hide -element_block">
        <div class="form_header">
            <h2 class="form_h">Создание чата</h2>
            <button onclick="close_form()" class="form_close_button -button_del_close -button">X</button>
        </div>
        <form class="form_create_chat -separete_block">
            <input type="text" id="name_chat" class="name_chat -separete_main -input_separete" placeholder="Название чата">
            <button onclick="create_chat(event)" id="send_chat" class="send_chat -separete_second -button_separete">Создать</button>
        </form>
    </div>
</dialog>
<section class="main_nav">
    <h1>Чаты</h1>
    <div class="search_form -separete_block">
        <input oninput="search_on_page('_chats')" type="text" id="search_chats" class="search_input -separete_main -input_separete" placeholder="Поиск чатов">
        <input onclick="search_on_page('_chats')" type="button" class="search_button -separete_second -button_separete" value="Поиск">
    </div>
    <button onclick="open_form()" class="button_add_chat -button_image" id="add_button"><img src="/static/image/add.svg" alt="Добавить чат"></button>
</section>
<section id="chats"> 
</section>
{% endblock %}

{% block scripts %}
<script src="/static/js/chats/chats.js"></script>
{% endblock %}
