<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="/static/style/style.css">
    {% block styles %}{% endblock %}
    <script src="/static/js/default/jquery-3.7.1.min.js"></script>
</head>
<body>
    <header>
        <nav class="header" id="header">
            <div class="nav_block">
                <section class="nav_section">
                    <article class="nav_article">
                        <div class="nav_element -separete_block">
                            <a class="nav_link -separete_main" href="{{url_for('chats.chats_get_api')}}">Чаты</a>
                            <button class="button_nav_open -separete_second">^</button>    
                        </div>
                        <div class="nav_hide_block">
                            <div class="nav_interior_block">
                                {% for chat_id, chat_name in chats.items() %}
                                    <a class="nav_interior_element -button" href="{{url_for('chats.get_chat_api', chat=chat_id)}}">{{chat_name}}</a>
                                {% endfor %}
                            </div>
                        </div>
                    </article>
                    {% block admin %}{% endblock %}
                </section>
                <a class="nav_link -button" href="{{url_for('auth.logout_api')}}">Выйти</a>
            </div>
            <button class="button_nav -button_image" id="button_nav"><img src="/static/image/menu.svg" alt="Кнопка открытия меню"></button>
        </nav>
    </header>
    <main id="main">
        {% for cat,msg in get_flashed_messages(True) %}
            <div class="flash {{cat}}">{{msg}}</div>
        {% endfor %}
        {% block content %}{% endblock %}
    </main>
</body>
{% block scripts %}{% endblock %}
<script src="/static/js/default/open_nav.js"></script>
</html>
