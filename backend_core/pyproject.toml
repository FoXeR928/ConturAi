[project]
name = "ConturAi"
version = "3.0.0"
description = "ConturAI Core: Lightweight AI Assistant Backend"
requires-python = ">=3.12,<=3.14"
dependencies = [
    "fastapi>=0.115.5",
    "uvicorn[standard]>=0.32.1",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "greenlet>=3.1.1",
    "pydantic>=2.10.3",
    "pydantic-settings>=2.6.1",
    "loguru>=0.7.3",
    "bcrypt>=4.2.1",
    "pyjwt>=2.10.1",
    "python-multipart>=0.0.20",
    "cryptography>=50.0.2",
    "docker>=7.0.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.4",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0", # Для тестов API
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]