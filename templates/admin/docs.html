{% if isAdmin %}
    {% extends "sample_admin.html" %}
{% else %}
    {% extends "sample_user.html" %}
{% endif %}

{% block title %}Документы{% endblock %}

{% block styles %}
<link rel="stylesheet" href="/static/style/style_docs.css">
{% endblock %}

{% block content %}
<section class="main_nav">
    <h1>Документы AI</h1>
    <input hidden required id="file" type="file" placeholder="Выберите файл для чтения" class="input_file -separete_main -input_separate" accept="application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
    <label for="file"><img src="/static/image/add.svg" alt="Добавить пользователя"></label>
</section>
<span class="loader"></span>
<form class="form_text_file -form_column">
    <div class="input_block -separete_block">
        <label class='label -input_label' for="">Название документа</label>
        <input type="text" id="file_name_text" class="file_name_text -input_with_label">  
    </div>
    <textarea name="file_text" id="file_text" class="file_text -separete_column_main"></textarea>
    <button id="send_text" class="send_text -separete_column_second">Сохранить</button>
</form>
{% endblock %}

{% block scripts %}
<script src="/static/js/read_file.js"></script>
{% endblock %}
