services:
  db:
    image: postgres:16-alpine
    container_name: conturai_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: conturai
      POSTGRES_USER: conturai
      POSTGRES_PASSWORD: ${DB_PASSWORD:-conturai_secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conturai -d conturai"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - conturai

  backend:
    build:
      context: ./backend
    container_name: conturai_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://conturai:${DB_PASSWORD:-conturai_secret}@db:5432/conturai
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      DOCKER_NETWORK: conturai_conturai
    volumes:
      - ./backend/plugins:/app/plugins:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request, sys
          try:
              with urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2) as r:
                  sys.exit(0 if r.status == 200 else 1)
          except Exception:
              sys.exit(1)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - conturai

  frontend:
    build:
      context: ./frontend
    container_name: conturai_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    networks:
      - conturai

volumes:
  pgdata:
networks:
  conturai:
    driver: bridge