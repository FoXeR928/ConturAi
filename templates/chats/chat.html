<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{chat_name}}</title>
    <link rel="stylesheet" href="/static/style/style.css">
    <link rel="stylesheet" href="/static/style/style_chat.css">
</head>
<body>
    <nav class="header">
        {% for path,name in nav.items() %}
            <a class="nav_link" href="{{url_for(path)}}">{{name}}</a>
        {% endfor %}
    </nav>
    <main>
        <section class="chat">
            {% for message in messages %}
                <div class="{{message[0]}}" id="{{message[1]}}">{{message[2] | safe}}</div>
            {% endfor %}
        </section>
        <form action="{{url_for('chats.create_message_api', chat=chat_id)}}" method="post">
            {{form.csrf_token}}
            {{form.chat_id(value=chat_id)}}
            {{form.message}}
            {{form.send_message}}
        </form>
    </main>
    
</body>
</html>
