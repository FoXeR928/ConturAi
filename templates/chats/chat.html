<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{chat_name}}</title>
    <link rel="stylesheet" href="/static/style/style.css">
    <link rel="stylesheet" href="/static/style/style_chat.css">
</head>
<body>
    <header class="header">
        <a class="nav_link" href="{{url_for('user.user_get_create_chats_api')}}">Вернуться к чатам</a>
    </header>
    <main>
        <section class="chat">
            {% for message in messages %}
                <div class="{{message[0]}}" id="{{message[1]}}">{{message[2] | safe}}</div>
            {% endfor %}
        </section>
        <form action="{{url_for('user.user_get_chat_api', chat=chat_id)}}" method="post">
            {{form.csrf_token}}
            {{form.message}}
            {{form.send_message}}
        </form>
    </main>
    
</body>
</html>
