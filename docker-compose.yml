name: conturai

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: conturai_postgres
    environment:
      POSTGRES_USER: ${CONTURAI_DB_USER:-conturai}
      POSTGRES_PASSWORD: ${CONTURAI_DB_PASSWORD:-conturai}
      POSTGRES_DB: ${CONTURAI_DB_NAME:-conturai}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CONTURAI_DB_USER:-conturai} -d ${CONTURAI_DB_NAME:-conturai}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  vllm:
    image: vllm/vllm-openai:latest
    container_name: conturai_vllm
    command: >
      --model /models/Qwen2.5-0.5B-Instruct
      --served-model-name local-model
      --host 0.0.0.0
      --port 8000
      --max-model-len 4096
      --gpu-memory-utilization 0.85
    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    ports:
      - "8080:8000"
    volumes:
      - ./models:/models:ro
    ipc: host
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: conturai_backend
    env_file: .env
    environment:
      CONTURAI_DB_HOST: postgres
      CONTURAI_VLLM_BASE_URL: http://vllm:8000/v1
      CONTURAI_EMBEDDING_MODEL_PATH: /models/multilingual-e5-large
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      vllm:
        condition: service_healthy
    volumes:
      - app_data:/app/data
      - ./models:/models:ro
    restart: unless-stopped

volumes:
  pgdata:
  app_data: