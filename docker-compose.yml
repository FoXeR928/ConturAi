name: ragi_ai

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ragi_postgres
    environment:
      POSTGRES_USER: ${RAGI_DB_USER:-ragi}
      POSTGRES_PASSWORD: ${RAGI_DB_PASSWORD:-ragi}
      POSTGRES_DB: ${RAGI_DB_NAME:-ragi}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RAGI_DB_USER:-ragi} -d ${RAGI_DB_NAME:-ragi}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  vllm:
    image: vllm/vllm-openai:latest
    container_name: ragi_vllm
    command: >
      --model ${RAGI_VLLM_MODEL:-Qwen/Qwen2.5-0.5B-Instruct}
      --host 0.0.0.0
      --port 8000
      --max-model-len 4096
      --gpu-memory-utilization 0.85
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    ports:
      - "8080:8000"
    volumes:
      - hf_cache:/root/.cache/huggingface
    ipc: host
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ragi_app
    env_file: .env
    environment:
      RAGI_DB_HOST: postgres
      RAGI_VLLM_BASE_URL: http://vllm:8000/v1
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      vllm:
        condition: service_healthy
    volumes:
      - app_data:/app/data              # ← логи + секреты
      - hf_cache:/root/.cache/huggingface
    restart: unless-stopped

volumes:
  pgdata:
  hf_cache:
  app_data:                             # ← том для /app/data