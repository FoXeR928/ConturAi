name: conturai

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: conturai_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-conturai}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-conturai}
      POSTGRES_DB: ${DB_NAME:-conturai}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  vllm:
    image: vllm/vllm-openai:latest
    container_name: conturai_vllm
    command: >
      --model /models/Qwen2.5-0.5B-Instruct
      --served-model-name local-model
      --host 0.0.0.0
      --port 8000
      --max-model-len 4096
      --gpu-memory-utilization 0.85
    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - ./models:/models:ro
    ipc: host
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    restart: unless-stopped
    # Порты наружу не нужны, бэкенд общается по внутренней сети

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        PYTORCH_INDEX: ${PYTORCH_INDEX:-https://download.pytorch.org/whl/cpu}
    container_name: conturai_backend
    env_file: .env
    environment:
      # Переопределяем хост, так как внутри docker-сети база называется "postgres"
      DB_HOST: postgres
      VLLM_BASE_URL: http://vllm:8000/v1
      DATA_DIR: /app/data
    ports:
      - "8000:8000" # Оставляем для Swagger и проверки /status
    depends_on:
      postgres:
        condition: service_healthy
      # vllm:
      #   condition: service_started
    volumes:
      - app_data:/app/data
      - ./models:/models:ro
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: conturai_frontend
    ports:
      - "3000:80" # Фронт будет доступен на http://localhost:3000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  app_data: