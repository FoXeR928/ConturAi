services:
  conturai-manager:
    build:
      context: ./manager
      dockerfile: Dockerfile
    image: conturai-manager:latest
    container_name: conturai-manager
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./static:/app/static:ro
    environment:
      - PYTHONUNBUFFERED=1
      - MANAGER_PORT=8080
      - POSTGRES_IMAGE=postgres:16-alpine
      - BACKEND_IMAGE=conturai-backend:latest
      - FRONTEND_IMAGE=conturai-frontend:latest
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 3