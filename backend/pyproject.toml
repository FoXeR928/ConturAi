[project]
name = "conturai-core"
version = "2.0.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "asyncpg>=0.29.0",
    "pyjwt>=2.9.0",
    "bcrypt>=4.2.0",
]

[tool.setuptools.packages.find]
include = ["app*"]