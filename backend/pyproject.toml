[project]
name = "ConturAi"
version = "2.0.0"
description = "AI assistant: vLLM + PostgreSQL pgvector"
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi>=0.115.5",
    "uvicorn[standard]>=0.32.1",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "greenlet>=3.1.1",
    "pgvector>=0.3.6",
    "pydantic>=2.10.3",
    "pydantic-settings>=2.6.1",
    "loguru>=0.7.3",
    "bcrypt>=4.2.1",
    "pyjwt>=2.10.1",
    "python-multipart>=0.0.20",
    "openai>=1.57.4",
    "sentence-transformers>=3.3.1",
    "pymorphy3>=2.0.4",
    "langchain-text-splitters>=0.3.3",
    "python-docx>=1.1.2",
    "openpyxl>=3.1.5",
    "pytesseract>=0.3.13",
    "pdf2image>=1.17.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.4",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"