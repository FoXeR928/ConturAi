name: Auto Update uv.lock

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'backend_core/pyproject.toml' # Срабатывает только при изменении зависимостей

jobs:
  update-lock:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "0.5.11"

      - name: Regenerate uv.lock
        run: |
          cd backend_core
          uv lock

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: update uv.lock [skip ci]"
          file_pattern: "backend_core/uv.lock"