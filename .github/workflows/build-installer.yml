name: Build Installer

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'installer/main.go' # Следим за изменениями только в коде установщика

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Windows EXE
        working-directory: ./installer
        run: |
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o ../bin/install.exe main.go

      - name: Build Linux Binary
        working-directory: ./installer
        run: |
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../bin/install-linux main.go

      - name: Commit compiled files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: build installers [skip ci]"
          file_pattern: "bin/*"